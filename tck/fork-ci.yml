name: Java CI with Gradle

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar el TCK oficial contra los módulos publicados
        env:
          TCK_PACKAGES_USER: ${{ secrets.TCK_PACKAGES_USER }}
          TCK_PACKAGES_TOKEN: ${{ secrets.TCK_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release/v}"
          version="${version%-run-*}"
          test -n "$TCK_PACKAGES_USER"
          test -n "$TCK_PACKAGES_TOKEN"
          PRINTSCRIPT_TCK_VERSION="$version" ./gradlew clean test --no-daemon --console=plain

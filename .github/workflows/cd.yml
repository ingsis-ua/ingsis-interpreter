name: CD

# Cada push a la rama principal (incluido un merge de PR) publica después de que
# termine exitosamente el CI de ese mismo commit. Un tag v* conserva la opción de
# publicar una versión estable y crear un GitHub Release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  push:
    tags: ['v*']

permissions:
  contents: write # crear el GitHub Release
  packages: write # publicar en GitHub Packages

env:
  TCK_FORK_REPOSITORY: Vontk/printscript-tck
  AUTO_RELEASE_BASE: 0.2.0

jobs:
  publicar:
    name: Publicar módulos y validar el TCK en el fork
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         (github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master'))
      }}
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 por la misma razón que en el CI: el ratchet de Spotless compara
      # contra origin/master y necesita la historia completa.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Instalar el JDK del toolchain declarado
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derivar una versión única del commit validado
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            version="${AUTO_RELEASE_BASE}-main.${CI_RUN_ID}.${CI_RUN_ATTEMPT}.${CI_HEAD_SHA:0:12}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:].]+)?$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Verificar acceso al fork
        env:
          GH_TOKEN: ${{ secrets.TCK_FORK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api "repos/$TCK_FORK_REPOSITORY" --jq .full_name

      # El tag no pasó por el CI de rama; ambos caminos vuelven a verificar el commit.
      - name: Verificar antes de publicar
        run: ./gradlew build -PprintscriptVersion=$VERSION --no-daemon --warning-mode all

      - name: Ejecutar el TCK de la cátedra con la prueba de streaming corregida
        run: ./tck/run-official-tck.sh "$VERSION"

      - name: Armar la distribución de la CLI
        run: ./gradlew :cli:distZip :cli:distTar -PprintscriptVersion=$VERSION --no-daemon

      # Los trece módulos, cada uno con su jar, su jar de fuentes y su POM con las
      # dependencias entre módulos ya resueltas.
      - name: Publicar los módulos en GitHub Packages
        run: ./gradlew publish -PprintscriptVersion=$VERSION --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validar los paquetes publicados en el CI del fork del TCK
        env:
          TCK_FORK_TOKEN: ${{ secrets.TCK_FORK_TOKEN }}
        run: ./tck/run-fork-ci.sh "$VERSION"

      - name: Publicar el Release con el ejecutable
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notas.tpl <<'NOTAS'
          ## Requisitos

          Java 21 o superior. Los módulos se compilan con el toolchain declarado en
          `printscript.java-library`, así que un JRE anterior falla con
          `UnsupportedClassVersionError`.

          ## Usar la CLI

          ```sh
          unzip printscript-__VERSION__.zip
          ./printscript-__VERSION__/bin/printscript execution programa.ps
          ./printscript-__VERSION__/bin/printscript validate  programa.ps
          ```

          Sin argumentos entra en modo interactivo y lee de stdin.

          ## Usar los módulos como librería

          ```kotlin
          repositories {
              maven("https://maven.pkg.github.com/ingsis-ua/ingsis-interpreter")
          }
          dependencies {
              implementation("org.printscript:runner:__VERSION__")
          }
          ```
          NOTAS
          sed "s/__VERSION__/$VERSION/g" notas.tpl > notas.md
          gh release create "$GITHUB_REF_NAME" \
            "cli/build/distributions/printscript-$VERSION.zip" \
            "cli/build/distributions/printscript-$VERSION.tar" \
            --title "PrintScript $VERSION" \
            --notes-file notas.md
